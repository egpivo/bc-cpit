default_language_version:
    python: python3
exclude: ^examples/

repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
    -   id: check-added-large-files
    -   id: check-toml
    -   id: check-yaml
        args:
        -   --unsafe
    -   id: end-of-file-fixer
    -   id: trailing-whitespace

-   repo: https://github.com/PyCQA/autoflake
    rev: v2.2.1
    hooks:
    -   id: autoflake
        args:
        - --recursive
        - --in-place
        - --remove-all-unused-imports
        - --remove-unused-variables
        - --remove-duplicate-keys
        - --exclude
        - __init__.py

-   repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
    -   id: isort
        args: ["--profile", "black"]

-   repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
    -   id: black

-   repo: local
    hooks:
    -   id: no-src-imports
        name: No legacy src.* imports
        entry: bash -c "if grep -rn 'from src\.' cpit/ tests/; then echo 'Found legacy src.* imports — use cpit.* instead'; exit 1; fi"
        language: system
        pass_filenames: false
