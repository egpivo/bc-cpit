[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cpit"
version = "1.0.0"
description = "Calibrated Predictive Distributions from Sample-Based Generators"
readme = "README.md"
authors = [
    {name = "Wen-Ting Wang", email = "egpivo@gmail.com"},
]
requires-python = ">=3.11"
license = {text = "MIT"}
keywords = ["conformal prediction", "calibration", "probability integral transform", "bias correction"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.20",
    "scipy>=1.7",
    "pygam>=0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["examples*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-v"
markers = [
    "integration: end-to-end simulation tests with fixed seed (slow)",
]
